plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.magremote'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.magremote"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Добавьте этот блок защиты:
    configurations.all {
        resolutionStrategy {
            force 'com.google.code.gson:gson:2.10.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Используем актуальную и стабильную версию NewPipeExtractor
    implementation 'com.github.teamnewpipe:NewPipeExtractor:main-SNAPSHOT'
    
    // Gson для сериализации
    implementation 'com.google.code.gson:gson:2.10.1'
}
