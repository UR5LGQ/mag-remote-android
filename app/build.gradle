plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.magremote'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.magremote"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Подключаем NewPipeExtractor через JitPack
    // Замените master-SNAPSHOT на актуальный тег, например 'v0.22.0' при стабильном релизе
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    
    // Gson для удобной сериализации ответов в JSON для JavaScript
    implementation 'com.google.code.gson:gson:2.10.1'
}